################################


[jwt]
# Must match Java's jwt.secret for token compatibility
secret = ""
# Access/refresh token expiration in seconds
access_ttl_secs = 86400
refresh_ttl_secs = 604800


# ── Agent configuration ──
[agent]
enabled = true
memory_enabled = true
rag_enabled = true
summary_enabled = true
max_context_messages = 30
max_memory_items = 10
max_rag_chunks = 5
memory_extraction_async = true
summary_async = true

# ── App 层意图路由轻量测试配置 ─────────────────────────────────────────────
# 用于 cargo test real_env_context_router_routes_lightweight_intent_cases --lib -- --ignored --nocapture
# 只测试 EmbeddingSemanticClassifier + ContextRoutingService，不启动数据库/RAG/Fresh 全链路。
[semantic_classification]
enabled = true
provider = "embedding"

[[semantic_classification.taxonomies]]
id = "context_routing"

[[semantic_classification.taxonomies.prototypes]]
id = "fresh_positive_latest_news"
label = "context.fresh.positive"
text = "用户询问今天、最新、最近、当前、实时、新闻、趋势、版本变化、外部世界刚发生的事情，需要短期实时上下文"
weight = 1.0

[[semantic_classification.taxonomies.prototypes]]
id = "fresh_negative_stable_task"
label = "context.fresh.negative"
text = "用户询问稳定知识、代码解释、写作、普通聊天、项目实现细节，答案主要来自已有上下文"
weight = 1.0

[[semantic_classification.taxonomies.prototypes]]
id = "memory_positive_personal_preference"
label = "context.memory.positive"
text = "用户表达自己的长期偏好、个人习惯、身份信息、关系、计划，或者要求记住某件关于自己的事情"
weight = 1.0

[[semantic_classification.taxonomies.prototypes]]
id = "memory_negative_generic_question"
label = "context.memory.negative"
text = "用户提出通用知识、代码实现、一次性任务、外部事实查询，不需要个人长期记忆"
weight = 1.0

[[semantic_classification.taxonomies.prototypes]]
id = "rag_positive_internal_knowledge"
label = "context.rag.positive"
text = "用户询问知识库、文档、项目资料、内部规章、已入库内容，需要检索长期知识库"
weight = 1.0

[[semantic_classification.taxonomies.prototypes]]
id = "rag_negative_current_conversation"
label = "context.rag.negative"
text = "用户只是继续当前对话、要求直接修改当前任务、简单闲聊、当前上下文已经足够，不需要检索知识库"
weight = 1.0

[[semantic_classification.taxonomies.prototypes]]
id = "current_task_positive_continue"
label = "context.current_task.positive"
text = "用户说继续、下一步、就这样改、按刚才方案实现，引用当前对话中的任务或代码上下文"
weight = 1.0

[context_routing]
enabled = true
taxonomy = "context_routing"
margin = 0.01

[context_routing.fresh_context]
positive_threshold = 0.45
negative_threshold = 0.95

[context_routing.memory]
positive_threshold = 0.45
negative_threshold = 0.95
low_confidence_top_k = 3

[context_routing.rag]
positive_threshold = 0.45
negative_threshold = 0.95
low_confidence_top_k = 1
current_task_top_k = 0

# ── Risk Detector (used in Phase 4) ──
[detector]
context_window_size = 4
confidence_threshold = 0.5

# ── Session Management (used in Phase 3) ──
[session]
timeout_seconds = 120
cleanup_interval_secs = 20

# ── Plugins (weather, news, etc.) ──
[plugins.weather]
# Inject via WEATHER_API_KEY env var — do NOT commit a real key here.
api_key = ""
default_location = "合肥"
city_lookup_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/geo/v2/city/lookup"
weather_now_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/v7/weather/now"
lang_query_enabled = false

[plugins.news]
default_rss_url = "https://www.chinanews.com.cn/rss/society.xml"
society_url = "https://www.chinanews.com.cn/rss/society.xml"
world_url = "https://www.chinanews.com.cn/rss/world.xml"
finance_url = "https://www.chinanews.com.cn/rss/finance.xml"

[plugins.web_search]
enabled = true
timeout_secs = 10

[plugins.fetch_web_content]
enabled = true
# proxy_url = "http://127.0.0.1:7890"

[plugins.baidu_baike]
enabled = true
# proxy_url = "http://127.0.0.1:7890"


# ── Web Ingestion Configuration ────────────────────────────────────────────
# ALL DISABLED BY DEFAULT. Enable only after all P0 fixes are complete.

[web_ingestion]
enabled = true
scheduler_enabled = true
dispatcher_enabled = true

# 初期构建知识库可以打开；如果混入高风险来源，改成 true + 手动发布
staging_required = false
auto_publish = true
auto_publish_min_score = 0.78

pipeline_version = "20260612"
fetch_user_agent = "ServerRSKnowledgeBot/0.1 (mailto:hughsean@qq.com)"
fetch_proxy_url = "http://127.0.0.1:7890"

# 对同一 host 的抓取节流。Wikipedia 建议别太激进
min_request_interval_ms = 1200
request_jitter_ms = 500

# 每个 source 每轮最多入队 URL 数
max_urls_per_source_per_job = 100
url_enqueue_dedupe_secs = 86400

# 单例下调度器可以勤快一点
scheduler_interval_secs = 60

# dispatcher_interval_secs = 30     # deprecated: event-driven loop, no longer polls
# outbox_batch_size = 24            # deprecated: single-event claim, no longer batches
dispatcher_parallelism = 24         # global concurrency limit (Semaphore permits)
outbox_lock_ttl_secs = 600

retry_base_delay_secs = 90
retry_max_delay_secs = 5400

[web_ingestion.handler_parallelism]
# 这些字段名对应 handler 消费的输入 outbox 事件，
# 不是 handler 内部实际执行的业务动作。
default = 1
url_discovered = 4                   # 消费 UrlDiscovered；抓取页面并创建/恢复摄取运行
page_distilled = 4                   # 消费 PageDistilled；执行质量门控判断
chunks_embedded = 4                  # 消费 ChunksEmbedded；持久化 embedding 结果并推进流程
terminal = 8                         # 消费 IngestionSkipped/KnowledgePublished 等终态事件
# The following use default = 1 (serial):
# crawl_job_created = 1            # 消费 CrawlJobCreated；选择到期 URL，并发出 UrlDiscovered
# page_fetched = 6                 # 消费 PageFetched；把已抓取 HTML 清洗成纯文本
# page_cleaned = 4                 # 消费 PageCleaned；对清洗后的文本执行 LLM 蒸馏
# quality_checked = 4              # 消费 QualityChecked；分流到拒绝、分块或暂存
# document_chunked = 4             # 消费 DocumentChunked；保存暂存文档/分块并推进流程
# document_indexed = 4             # 消费 DocumentIndexed；写入暂存向量索引元数据并推进流程
# knowledge_staged = 2             # 消费 KnowledgeStaged；完成暂存，必要时发起发布请求
# knowledge_publish_requested = 1  # 消费 KnowledgePublishRequested；激活暂存版本
# knowledge_rollback_requested = 1 # 消费 KnowledgeRollbackRequested；回滚当前激活版本


[qq_bot]
enabled = false
self_qq_id = 1                                     # 你的机器人QQ号
http_base_url = "http://127.0.0.1:3000"
ws_url = "ws://127.0.0.1:6700"
tts_output_dir = "./data/tts/"
tts_public_url_base = "http://127.0.0.1:8080/tts/"

# ── TTS (Text-to-Speech) ───────────────────────────────────────────
# 火山引擎豆包语音 v3 配置
# 生产环境建议用环境变量注入：TTS_API_KEY、TTS_RESOURCE_ID
[tts]
provider = "volcengine"
base_url = "https://openspeech.bytedance.com/api/v3/tts/unidirectional"
api_key = ""
resource_id = ""
model = "seed-tts-2.0-standard"
default_voice = "zh_female_wanwanxiaohe_moon_bigtts"
default_encoding = "wav"
timeout_secs = 30
sample_rate = 24000
