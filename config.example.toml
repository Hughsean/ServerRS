[ssh_tunnels.mysql]
host = "HP"
local_port = 3306
remote_port = 3306

[database]
# Required template when tunnel is set.
url = "mysql://user:password@{ip}:{port}/digital_companion"
max_connections = 10
tunnel = "mysql"
################################
[ssh_tunnels.ollama]
host = "807-P"
local_port = 11111
remote_port = 11434

[ollama]
# Required template when tunnel is set. {ip}/{port} are replaced with the tunnel local endpoint.
base_url = "http://{ip}:{port}/v1"
model = "qwen3:14b"
temperature = 0.5
top_p = 0.9
tunnel = "ollama"

[embedding]
provider = "Ollama-local"
# Required template when tunnel is set. The /v1 path comes from this template.
base_url = "http://{ip}:{port}/v1"
tunnel = "ollama"
model = "qwen3-embedding:4b"
dimension = 2560
batch_size = 32
timeout_secs = 120
qdrant_collection = "rag_chunks_2560"

[llm]
provider = "Ollama"
# Required template when tunnel is set.
base_url = "http://{ip}:{port}/v1"
tunnel = "ollama"
chat_model = "qwen3:14b"
temperature = 0.7
top_p = 0.9
timeout_secs = 120
max_tool_depth = 10

[web_ingestion.distill_llm]
provider = "Ollama"
# Concrete URL because this section does not declare a tunnel.
base_url = "http://127.0.0.1:18080/v1"
chat_model = "qwen3:14b"
# Ollama/local OpenAI-compatible endpoints can leave api_key empty.
# Remote providers should inject WEB_INGESTION_DISTILL_LLM_API_KEY or DEEPSEEK_API_KEY.
temperature = 0.1
top_p = 0.9
timeout_secs = 180
################################
[ssh_tunnels.qdrant]
host = "HP"
local_port = 6334
remote_port = 6334

# ── Qdrant VectorStore ────────────────────────────────────────────────────────
# Qdrant is an optional vector index for RAG / Memory / Summary search.
# When disabled (default), vector search falls back to MySQL keyword search.
[qdrant]
enabled = true
# Required template when tunnel is set.
url = "http://{ip}:{port}"
# api_key = ""
rag_collection = "rag_chunks_2560"
memory_collection = "user_memories_2560"
summary_collection = "conversation_summaries_2560"
tunnel = "qdrant"
################################

[ssh_tunnels.public]
direction = "remote"
host = "Tencent"
local_port = 8080
remote_port = 8080
bind_address = "0.0.0.0"

[server]
host = "0.0.0.0"
port = 8080

[logging]
level = "debug"

[cors]
allowed_origins = ["http://localhost:3000", "http://localhost:5173", "http://127.0.0.1:5173"]
################################


[jwt]
# Must match Java's jwt.secret for token compatibility
secret = ""
# Access/refresh token expiration in seconds
access_ttl_secs = 86400
refresh_ttl_secs = 604800


# ── Agent configuration ──
[agent]
enabled = true
memory_enabled = true
rag_enabled = true
summary_enabled = true
max_context_messages = 30
max_memory_items = 10
max_rag_chunks = 5
memory_extraction_async = true
summary_async = true

# ── Risk Detector (used in Phase 4) ──
[detector]
context_window_size = 4
confidence_threshold = 0.5

# ── Session Management (used in Phase 3) ──
[session]
timeout_seconds = 120
cleanup_interval_secs = 20

# ── Plugins (weather, news, etc.) ──
[plugins.weather]
# Inject via WEATHER_API_KEY env var — do NOT commit a real key here.
api_key = ""
default_location = "合肥"
city_lookup_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/geo/v2/city/lookup"
weather_now_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/v7/weather/now"
lang_query_enabled = false

[plugins.news]
default_rss_url = "https://www.chinanews.com.cn/rss/society.xml"
society_url = "https://www.chinanews.com.cn/rss/society.xml"
world_url = "https://www.chinanews.com.cn/rss/world.xml"
finance_url = "https://www.chinanews.com.cn/rss/finance.xml"

[plugins.web_search]
enabled = true
timeout_secs = 10

[plugins.fetch_web_content]
enabled = true
# proxy_url = "http://127.0.0.1:7890"

[plugins.baidu_baike]
enabled = true
# proxy_url = "http://127.0.0.1:7890"



# ── Web Ingestion Configuration ────────────────────────────────────────────
# ALL DISABLED BY DEFAULT. Enable only after all P0 fixes are complete.

[web_ingestion]
enabled = true
scheduler_enabled = false
dispatcher_enabled = true

# 初期构建知识库可以打开；如果混入高风险来源，改成 true + 手动发布
staging_required = false
auto_publish = true
auto_publish_min_score = 0.78

pipeline_version = "20260612"
fetch_user_agent = "ServerRSKnowledgeBot/0.1 (mailto:xxx@xxx.com)"
fetch_proxy_url = "http://127.0.0.1:7890"

# 对同一 host 的抓取节流。Wikipedia 建议别太激进
min_request_interval_ms = 1200
request_jitter_ms = 500

# 每个 source 每轮最多入队 URL 数
max_urls_per_source_per_job = 100
url_enqueue_dedupe_secs = 86400

# 单例下调度器可以勤快一点
scheduler_interval_secs = 60

# dispatcher 每轮总领取数 <= min(outbox_batch_size, dispatcher_parallelism)。
# 领取时会按 handler_parallelism 给各事件类型分配配额，避免慢阶段锁住过多任务。
dispatcher_interval_secs = 1
outbox_batch_size = 30
dispatcher_parallelism = 10
outbox_lock_ttl_secs = 600

retry_base_delay_secs = 90
retry_max_delay_secs = 5400

[web_ingestion.handler_parallelism]
default = 1
crawl_job_created = 1
url_discovered = 4
page_fetched = 6
page_cleaned = 2
page_distilled = 4
quality_checked = 4
document_chunked = 4
chunks_embedded = 4
document_indexed = 4
knowledge_staged = 2
knowledge_publish_requested = 1
knowledge_rollback_requested = 1
terminal = 8


# ── Fresh Context Configuration ─────────────────────────────────────────────
# Short-lived news/trend/gossip context. Keep disabled until database/sql/fresh_context.sql
# has been reviewed and applied.

[fresh_context]
enabled = false
# scheduler collects enabled sources; dispatcher distills and publishes fetched items.
scheduler_enabled = false
dispatcher_enabled = false
qdrant_collection = "fresh_chunks_2560"
scheduler_interval_secs = 900
dispatcher_interval_secs = 30
max_sources_per_tick = 8
max_items_per_source = 50
max_pipeline_items_per_tick = 50
chunk_size = 900
chunk_overlap = 120
max_indexable_chunks_per_tick = 100
max_topic_items_per_tick = 100
max_expired_vectors_per_tick = 200
max_retrieval_chunks = 3
fetch_timeout_secs = 20
fetch_user_agent = "ServerRSFreshBot/0.1 (mailto:xxx@xxx.com)"
fetch_proxy_url = "http://127.0.0.1:7890"

# Hot/trendy content should expire quickly; background explainers can live longer.
trend_ttl_secs = 86400
gossip_ttl_secs = 259200
news_ttl_secs = 1209600
background_ttl_secs = 15552000

# Retrieval ranking weights for fresh context.
min_reliability_score = 0.35
semantic_weight = 0.55
freshness_weight = 0.25
reliability_weight = 0.15
heat_weight = 0.05

[fresh_context.distill_llm]
provider = "Ollama"
base_url = "http://127.0.0.1:18080/v1"
chat_model = "qwen3:14b"
# Ollama/local OpenAI-compatible endpoints can leave api_key empty.
# Remote providers should inject FRESH_CONTEXT_DISTILL_LLM_API_KEY or DEEPSEEK_API_KEY.
temperature = 0.1
top_p = 0.9
timeout_secs = 180


[qq_bot]
enabled = false
self_qq_id = 'xxx'     # 你的机器人QQ号
http_base_url = "http://127.0.0.1:3000"
ws_url = "ws://127.0.0.1:6700"
tts_output_dir = "./data/tts/"
tts_public_url_base = "http://127.0.0.1:8080/tts/"

# ── TTS (Text-to-Speech) ───────────────────────────────────────────
# 火山引擎豆包语音 v3 配置
# 生产环境建议用环境变量注入：TTS_API_KEY、TTS_RESOURCE_ID
[tts]
provider = "volcengine"
base_url = "https://openspeech.bytedance.com/api/v3/tts/unidirectional"
api_key = ""
resource_id = ""
model = "seed-tts-2.0-standard"
default_voice = "zh_female_wanwanxiaohe_moon_bigtts"
default_encoding = "wav"
timeout_secs = 30
sample_rate = 24000
