# ServerRS Configuration — mirrors Java's application.yml
# All fields have defaults; this file is optional.

[server]
host = "0.0.0.0"
port = 8080

[database]
# MySQL connection (aligns with Java's datasource.url)
url = "mysql://user:password@127.0.0.1:3306/digital_companion"
max_connections = 10

[jwt]
# Must match Java's jwt.secret for token compatibility
secret = "CHANGE_ME_USE_A_LONG_RANDOM_SECRET"
# Access/refresh token expiration in seconds
access_ttl_secs = 86400
refresh_ttl_secs = 604800

# ── LLM / Ollama (used in Phase 3) ──
[ollama]
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:14b"
temperature = 0.5
top_p = 0.9

# ── LLM configuration ──
[llm]
provider = "openai"
base_url = "http://127.0.0.1:11434/v1"
chat_model = "qwen2.5:14b"
temperature = 0.7
top_p = 0.9
timeout_secs = 120
max_tool_depth = 10

# ── Agent configuration ──
[agent]
enabled = true
memory_enabled = true
rag_enabled = true
summary_enabled = true
max_context_messages = 30
max_memory_items = 10
max_rag_chunks = 5
memory_extraction_async = true
summary_async = true

# ── Risk Detector (used in Phase 4) ──
[detector]
context_window_size = 4
confidence_threshold = 0.5

# ── Session Management (used in Phase 3) ──
[session]
timeout_seconds = 120
cleanup_interval_secs = 20

# ── Plugins (weather, news, etc.) ──

[plugins.weather]
# Inject via WEATHER_API_KEY env var — do NOT commit a real key here.
api_key = ""
default_location = "合肥"
city_lookup_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/geo/v2/city/lookup"
weather_now_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/v7/weather/now"
lang_query_enabled = false

[plugins.news]
default_rss_url = "https://www.chinanews.com.cn/rss/society.xml"
society_url = "https://www.chinanews.com.cn/rss/society.xml"
world_url = "https://www.chinanews.com.cn/rss/world.xml"
finance_url = "https://www.chinanews.com.cn/rss/finance.xml"

[plugins.web_search]
enabled = true
timeout_secs = 10

[plugins.fetch_web_content]
enabled = true

[plugins.baidu_baike]
enabled = true

# ── Qdrant VectorStore ────────────────────────────────────────────────────────
# Qdrant is an optional vector index for RAG / Memory / Summary search.
# When disabled (default), vector search falls back to MySQL keyword search.
[qdrant]
enabled = true
url = "http://127.0.0.1:6334"
# api_key = ""
rag_collection = "rag_chunks"
memory_collection = "user_memories"
summary_collection = "conversation_summaries"

# ── Web Ingestion Configuration ────────────────────────────────────────────
# ALL DISABLED BY DEFAULT. Enable only after all P0 fixes are complete.

[web_ingestion]
enabled = false
scheduler_enabled = false
dispatcher_enabled = false
staging_required = true
auto_publish_min_score = 0.85
pipeline_version = "20260612"
fetch_user_agent = "ServerRSKnowledgeBot/0.1 (mailto:you@example.com)"
fetch_proxy_url = ""
min_request_interval_ms = 2000
request_jitter_ms = 1000
max_urls_per_source_per_job = 20
url_enqueue_dedupe_secs = 86400
scheduler_interval_secs = 900
dispatcher_interval_secs = 5
outbox_batch_size = 20
outbox_lock_ttl_secs = 300
retry_base_delay_secs = 30
retry_max_delay_secs = 1800

[web_ingestion.distill_llm]
provider = "deepseek"
base_url = "https://api.deepseek.com"
chat_model = "deepseek-v4-flash"
# Inject via WEB_INGESTION_DISTILL_LLM_API_KEY (or DEEPSEEK_API_KEY) env var.
# Never commit a real key here.
api_key = ""
temperature = 0.1
top_p = 0.9
timeout_secs = 120

# ── Embedding Provider (separate from distill LLM) ────────────────────────

[embedding]
provider = "ollama"
base_url = "http://127.0.0.1:11434/v1"
model = "nomic-embed-text"
# api_key = ""
dimension = 768
batch_size = 32
timeout_secs = 120
qdrant_collection = "rag_default"
