[ssh_tunnels.vector_store]
host = "HP"
local_port = 6334
remote_port = 6334

# ── 向量存储 ───────────────────────────────────────────────────────────────────
# 向量存储为 RAG / 记忆 / 摘要搜索提供可选索引。
# When disabled (default), vector search falls back to MySQL keyword search.
[vector_store]
enabled = true
url = "http://{ip}:{port}"
# api_key = ""
rag_index_name = "rag_chunks_2560"
memory_index_name = "user_memories_2560"
summary_index_name = "conversation_summaries_2560"
tunnel = "vector_store"
