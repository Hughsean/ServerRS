# Local Nginx load balancer for web_ingestion distill LLM.
#
# Expected topology:
#   127.0.0.1:11111 -> SSH tunnel -> Ollama A :11434
#   127.0.0.1:11112 -> SSH tunnel -> Ollama B :11434
#   127.0.0.1:18080 -> this Nginx -> one of the two upstreams
#
# ServerRS config:
#   [web_ingestion.distill_llm]
#   base_url = "http://127.0.0.1:18080/v1"

worker_processes 1;

pid logs/ollama-distill-lb.pid;
error_log logs/ollama-distill-lb-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log logs/ollama-distill-lb-access.log;

    client_body_temp_path temp/client_body_temp;
    proxy_temp_path temp/proxy_temp;
    fastcgi_temp_path temp/fastcgi_temp;
    uwsgi_temp_path temp/uwsgi_temp;
    scgi_temp_path temp/scgi_temp;

    upstream ollama_distill {
        least_conn;

        server 127.0.0.1:11111 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:11112 max_fails=2 fail_timeout=30s;

        keepalive 32;
    }

    server {
        listen 127.0.0.1:18080;

        client_max_body_size 20m;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://ollama_distill;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}
