# ServerRS Configuration — mirrors Java's application.yml
# All fields have defaults; this file is optional.

[server]
host = "0.0.0.0"
port = 8080

[database]
# MySQL connection (aligns with Java's datasource.url)
url = "mysql://user:password@127.0.0.1:3306/digital_companion"
max_connections = 10

[jwt]
# Must match Java's jwt.secret for token compatibility
secret = "CHANGE_ME_USE_A_LONG_RANDOM_SECRET"
# Access/refresh token expiration in seconds
access_ttl_secs = 86400
refresh_ttl_secs = 604800

# ── LLM / Ollama (used in Phase 3) ──
[ollama]
base_url = "http://127.0.0.1:11434/v1"
model = "qwen2.5:14b"
temperature = 0.5
top_p = 0.9

# ── LLM configuration ──
[llm]
provider = "openai"
base_url = "http://127.0.0.1:11434/v1"
chat_model = "qwen2.5:14b"
temperature = 0.7
top_p = 0.9
timeout_secs = 120
max_tool_depth = 10

# ── Agent configuration ──
[agent]
enabled = true
memory_enabled = true
rag_enabled = true
summary_enabled = true
max_context_messages = 30
max_memory_items = 10
max_rag_chunks = 5
memory_extraction_async = true
summary_async = true

# ── Risk Detector (used in Phase 4) ──
[detector]
context_window_size = 4
confidence_threshold = 0.5

# ── Session Management (used in Phase 3) ──
[session]
timeout_seconds = 120
cleanup_interval_secs = 20

# ── Plugins (weather, news, etc.) ──

[plugins.weather]
api_key = ""
default_location = "合肥"
city_lookup_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/geo/v2/city/lookup"
weather_now_endpoint = "https://mk4ky3n4am.re.qweatherapi.com/v7/weather/now"
lang_query_enabled = false

[plugins.news]
default_rss_url = "https://www.chinanews.com.cn/rss/society.xml"
society_url = "https://www.chinanews.com.cn/rss/society.xml"
world_url = "https://www.chinanews.com.cn/rss/world.xml"
finance_url = "https://www.chinanews.com.cn/rss/finance.xml"

[plugins.web_search]
enabled = true
timeout_secs = 10

[plugins.fetch_web_content]
enabled = true

[plugins.baidu_baike]
enabled = true

# ── Embedding Provider ──────────────────────────────────────────────────────
# Separate from the chat LLM — embedding uses its own model.
[embedding]
provider = "ollama"
base_url = "http://127.0.0.1:11434/v1"
model = "nomic-embed-text"
dimension = 768

# ── Qdrant VectorStore ────────────────────────────────────────────────────────
# Qdrant is an optional vector index for RAG / Memory / Summary search.
# When disabled (default), vector search falls back to MySQL keyword search.
[qdrant]
enabled = true
url = "http://127.0.0.1:6334"
# api_key = ""
rag_collection = "rag_chunks"
memory_collection = "user_memories"
summary_collection = "conversation_summaries"
