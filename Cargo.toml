[package]
name = "ServerRS"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
bcrypt = "0.19.0"
chrono = { version = "0.4.42", features = ["serde"] }
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json"] }
sea-orm = { version = "1.1.20", features = ["sqlx-sqlite", "runtime-tokio", "sqlx-mysql"] }
sea-orm-migration = { version = "1.1.20", features = ["sqlx-sqlite", "runtime-tokio", "sqlx-mysql"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
