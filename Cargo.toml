[package]
name = "server-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
base64 = "0.22.1"
bcrypt = "0.19.0"
chrono = { version = "0.4.42", features = ["serde"] }
dashmap = "6.2.1"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mime = "0.3.17"
quick-xml = "0.40.1"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["json", "gzip", "deflate", "brotli", "native-tls"] }
rss = "2.0.13"
scraper = "0.27.0"
sea-orm = { version = "2.0.0-rc.38", features = [ "runtime-tokio", "sqlx-mysql"] }
sqlx = { version = "0.9.0", default-features = false, features = ["mysql-rsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
dotenvy = "0.15"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
toml = "1.1.2"
# time 0.3.48 introduces blanket impls that conflict with sea-query 1.0.1
# and sqlx-core 0.9.0 on Rust >=1.96 (E0119). Pin to 0.3.47 until upstream
# resolves the conflict. Remove this pin after upgrading sea-orm >rc.40.
time = ">=0.3.47, <0.3.48"
tower-http = { version = "0.6.11", features = ["cors", "trace", "timeout", "compression-br", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1.23.1", features = ["v4"] }
validator = { version = "0.20.0", features = ["derive"] }
qdrant-client = { version = "1.15", optional = true }

[features]
default = []
qdrant = ["dep:qdrant-client"]

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[[bin]]
name = "server-rs"
path = "src/main.rs"

[[bin]]
name = "qq_bot_init"
path = "src/bin/qq_bot_init.rs"
