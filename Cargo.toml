[workspace]
resolver = "3"
members = [
    "qqbot-server",
    "agent-core",
    "personal-secretary",
    "personal-secretary-mysql",
    "qqbot",
    "qq-open-platform",
    "tools/architecture-tests",
]
default-members = ["qqbot-server"]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
# Workspace crates
agent-core = { path = "agent-core" }
personal-secretary = { path = "personal-secretary" }
personal-secretary-mysql = { path = "personal-secretary-mysql" }
qqbot = { path = "qqbot" }
qq-open-platform = { path = "qq-open-platform" }

# Async
async-trait = "0.1.89"
futures-util = "0.3"
tokio = "1.53.1"
tokio-tungstenite = "0.30"
tokio-util = "0.7"
tempfile = "3"

# Transport
reqwest = "0.13.4"

# Security
base64 = "0.22.1"
fs2 = "0.4.3"
ring = "0.17.14"
sha2 = "0.11.0"
uuid = "1.23.1"

# Data and utilities
dotenvy = "0.15"
regex = "1.12.3"
serde = "1.0.228"
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.2"
url = "2.5.8"

# Persistence
sea-orm = "2.0.0"

# Time and observability
chrono = "0.4.42"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
