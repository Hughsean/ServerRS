[workspace]
resolver = "3"
members = [
    "apps/digital-human-server",
    "apps/qqbot-server",
    "crates/agent-core",
    "crates/ai-core",
    "crates/digital-human",
    "crates/personal-secretary",
    "crates/qqbot",
    "crates/qq-open-platform",
]
default-members = ["apps/digital-human-server", "apps/qqbot-server"]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
# Workspace crates
agent-core = { path = "crates/agent-core" }
ai-core = { path = "crates/ai-core" }
digital-human = { path = "crates/digital-human", default-features = false }
personal-secretary = { path = "crates/personal-secretary" }
qqbot = { path = "crates/qqbot" }
qq-open-platform = { path = "crates/qq-open-platform" }

# Async
async-trait = "0.1.89"
futures-util = "0.3"
tokio = "1.53.1"
tokio-tungstenite = "0.30"
tokio-util = "0.7"

# Web and transport
axum = "0.8.9"
reqwest = "0.13.4"
tower-http = "0.7.0"
urlencoding = "2"

# Security
base64 = "0.22.1"
bcrypt = "0.19.2"
jsonwebtoken = "10.3.0"
sha2 = "0.11.0"
uuid = "1.23.1"

# Data and utilities
dashmap = "6.2.1"
dotenvy = "0.15"
regex = "1.12.3"
scraper = "0.27.0"
serde = "1.0.228"
serde_json = "1.0.151"
thiserror = "2.0.19"
toml = "1.1.2"
url = "2.5.8"
validator = "0.20.0"

# Persistence
qdrant-client = "1.15"
sea-orm = "2.0.0"
sqlx = { version = "0.9.0", default-features = false }

# Time and observability
chrono = "0.4.42"
time = "0.3"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = "0.3.23"

# CLI
rpassword = "7"
rustyline = "15"

# Source-level architecture checks
proc-macro2 = "1"
syn = "2"
