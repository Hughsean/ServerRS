[package]
name = "server-rs"
version = "1.0.0"
edition = "2024"

[dependencies]
# Async
async-trait = "0.1.89"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
futures-util = "0.3"

# Web framework
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "timeout", "compression-br", "fs"] }
reqwest = { version = "0.13.4", features = ["json", "gzip", "deflate", "brotli", "native-tls"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
urlencoding = "2"

# Security
base64 = "0.22.1"
bcrypt = "0.19.0"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
sha2 = "0.11.0"
uuid = { version = "1.23.1", features = ["v4"] }

# Data structures and utilities
dashmap = "6.2.1"
regex = "1.12.3"
scraper = "0.27.0"
toml = "1.1.2"
validator = { version = "0.20.0", features = ["derive"] }

dotenvy = "0.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"

# Database
sqlx = { version = "0.9.0", default-features = false, features = ["mysql-rsa"] }
sea-orm = { version = "2.0.0-rc.41", features = [ "runtime-tokio", "sqlx-mysql"] }
qdrant-client = { version = "1.15", optional = true }

# Time and date handling
chrono = { version = "0.4.42", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"

[features]
default = ["qdrant"]
qq_bot = []
qdrant = ["dep:qdrant-client"]

[dev-dependencies]

[[bin]]
name = "server-rs"
path = "src/main.rs"

[[bin]]
name = "qq_bot_init"
path = "src/bin/qq_bot_init.rs"
required-features = ["qq_bot"]
