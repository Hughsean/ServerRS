[package]
name = "digital-human-server"
version.workspace = true
edition.workspace = true
autobins = false

[lib]
name = "digital_human_server"
path = "src/lib.rs"

[dependencies]
agent-core.workspace = true
ai-core.workspace = true
digital-human.workspace = true

# Async
async-trait.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
    "sync",
] }
tokio-util = { workspace = true, features = ["rt"] }
futures-util.workspace = true

# Web framework
axum = { workspace = true, features = ["macros", "multipart"] }
tower-http = { workspace = true, features = [
    "cors",
    "trace",
    "timeout",
    "compression-br",
] }
reqwest = { workspace = true, features = [
    "json",
    "gzip",
    "deflate",
    "brotli",
    "native-tls",
] }
tokio-tungstenite = { workspace = true, features = ["native-tls"] }
urlencoding.workspace = true

# Security
base64.workspace = true
bcrypt.workspace = true
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }

# Data structures and utilities
dashmap.workspace = true
regex.workspace = true
scraper.workspace = true
toml.workspace = true
url.workspace = true
validator = { workspace = true, features = ["derive"] }

dotenvy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# Database
sqlx = { workspace = true, features = ["mysql-rsa"] }
sea-orm = { workspace = true, features = [
    "runtime-tokio",
    "sqlx-mysql",
] }
qdrant-client = { workspace = true, optional = true }

# Time and date handling
chrono = { workspace = true, features = ["serde"] }
time = { workspace = true, features = ["formatting", "macros"] }

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "time",
] }
tracing-appender.workspace = true

# CLI
rustyline.workspace = true
rpassword.workspace = true

[features]
default = ["qdrant"]
qdrant = ["dep:qdrant-client", "digital-human/qdrant"]

[dev-dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["full", "visit"] }

[build-dependencies]
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["full", "visit"] }

[[bin]]
name = "digital-human-server"
path = "src/main.rs"

[[bin]]
name = "repair_vector_activation"
path = "src/bin/repair.rs"
required-features = ["qdrant"]

[[bin]]
name = "cli"
path = "src/bin/cli.rs"
