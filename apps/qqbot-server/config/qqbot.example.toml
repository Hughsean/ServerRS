[napcat]
ws_url = "ws://127.0.0.1:6700"
http_base_url = "http://127.0.0.1:3000"
self_qq_id = 123456789
reconnect_initial_secs = 1
reconnect_max_secs = 60

# OneBot Heartbeat 超时监控（评审第三轮 P1-3）。
# 缺失整个 [napcat.heartbeat] 段时使用默认宽松配置（enabled=true, grace=300s）。
# 若 NapCat 实现不发送兼容 meta_event/heartbeat，可设 enabled=false 禁用 watchdog，
# 或调大 startup_grace_secs 避免错误重连。
[napcat.heartbeat]
enabled = true
startup_grace_secs = 300
min_interval_secs = 5
max_interval_secs = 300
default_interval_secs = 30
timeout_multiplier = 3

[database]
url = "mysql://serverrs:change_me@127.0.0.1:3306/qq_personal_secretary?ssl-mode=required"
max_connections = 5

[llm]
enabled = false
base_url = "http://127.0.0.1:11434/v1"
model = ""
reasoning_mode = "provider_default"
# API Key 不写入 TOML；使用 QQBOT_LLM_API_KEY，或取消下一行注释指向本地文件。
# api_key_file = "D:/private/qqbot-llm-api-key.txt"
connect_timeout_secs = 10
request_timeout_secs = 60
max_input_chars = 60000
max_output_tokens = 2000
max_response_bytes = 1048576
temperature = 0.1
max_candidates_per_kind = 20

[ingestion]
queue_capacity = 1024
retry_initial_ms = 100
retry_max_ms = 5000
shutdown_drain_timeout_secs = 10

[backfill]
enabled = true
page_size = 100
max_pages_per_scope = 20
max_events_per_run = 2000
max_concurrency = 2
lease_secs = 60
retry_initial_ms = 500
retry_max_ms = 10000

[thread_semantics]
enabled = true
max_events = 50
max_total_chars = 50000
max_event_chars = 10000
max_batches_per_scan = 10
lease_secs = 60
scan_interval_ms = 1000
retry_initial_ms = 500
retry_max_ms = 10000

[memory_candidates]
# 结构化记忆候选提取：候选先落库为 proposed，Owner 通过 List/Approve/Reject
# 审批后才成为 Confirmed MemoryFact。默认关闭（保守）；LLM 端点非回环时
# local_only 正文不会进入提取模型。
enabled = false
scan_interval_ms = 30000
batch_size = 10
lease_secs = 60
retry_initial_ms = 500
retry_max_ms = 10000
max_events_per_batch = 20
max_event_chars = 2000
# 整批输入总字符硬上限（1..=16000，环境变量不可突破成本边界）。
max_total_input_chars = 16000
extractor_version = "v1"

[thread_projection]
enabled = true
batch_size = 100
max_batches_per_scan = 10
same_conversation_window_secs = 300
lease_secs = 60
scan_interval_ms = 500
retry_initial_ms = 500
retry_max_ms = 10000

[thread_links]
enabled = true
max_events = 100
max_total_chars = 100000
max_batches_per_scan = 10
lease_secs = 60
scan_interval_ms = 1500
retry_initial_ms = 500
retry_max_ms = 10000

[follow_up]
enabled = true
scan_interval_ms = 30000
horizon_secs = 604800
# 外部联系人开放问题在未见本人回复多久后形成 Owner 提醒候选（默认 4 小时）。
response_timeout_secs = 14400
# 项目阻塞事实保持多久后向 Owner 升级（默认 24 小时）。
blocker_escalation_secs = 86400
batch_size = 200
retry_initial_ms = 1000
retry_max_ms = 60000

[agenda]
# 仅为已到期且仍为当前版本的 Owner Agenda 生成统一策略 Candidate。
# 只有 Notification Policy 判定为 Remind 后才会写入 Outbox。
enabled = true
scan_interval_ms = 30000
batch_size = 200
retry_initial_ms = 1000
retry_max_ms = 60000

[notification_policy]
# 统一领取 Evaluation Request 并执行纯策略求值；不直接调用 QQ transport。
enabled = true
worker_id = "qqbot-notification-policy-v1"
batch_size = 100
lease_secs = 60
scan_interval_ms = 1000
retry_initial_ms = 1000
retry_max_ms = 60000
recovery_limit = 1000
# 启动前独占协调遗留的来源直写 Outbox；未清除屏障则拒绝启动投递 Worker。
reconciliation_worker_id = "qqbot-legacy-owner-outbox-v1"
reconciliation_lease_secs = 60
reconciliation_page_size = 100
reconciliation_max_rows = 10000
reconciliation_deadline_secs = 120

[artifact]
enabled = true
default_ttl_secs = 86400
ttl_scan_interval_ms = 60000

[recall_wal]
# Callback only appends+syncs encrypted frames; MySQL delivery is asynchronous.
path = "data/qqbot-recall.spool"
quarantine_dir = "data/qqbot-recall-quarantine"
# Name of the environment variable holding a base64-encoded random 32-byte AES-256 key.
# Do not put the key in TOML or source control. Example: QQBOT_RECALL_WAL_KEY.
key_env = "QQBOT_RECALL_WAL_KEY"
max_bytes = 16777216
drain_interval_ms = 1000

[health]
enabled = true
cache_ttl_secs = 5
log_interval_ms = 30000
worker_success_stale_secs = 300

[qq_open_platform]
enabled = false
app_id = ""
owner_openid = ""
# Secret 不写入此文件；使用 QQBOT_OPEN_PLATFORM_CLIENT_SECRET，或取消下一行注释指向本地文件。
# client_secret_file = "D:/private/qqbot-secret.txt"
reconnect_initial_ms = 1000
reconnect_max_ms = 60000
notification_lease_secs = 60

[whitelist]
# 群白名单 JSON 文件路径。不配则不启用白名单（处理所有群消息）。
# 文件格式：{"groups": [群号1, 群号2, ...]}
# whitelist_file = "whitelist/group_whitelist.json"
