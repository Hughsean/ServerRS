services:
  mysql:
    image: mysql:8
    container_name: serverrs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: passwd
      MYSQL_DATABASE: digital_companion
    ports:
      - "3306:3306"
    # 生产/远端环境必须通过 MYSQL_DATA_DIR 指向仓库外目录，避免 git clean 清除数据库。
    volumes:
      - ${MYSQL_DATA_DIR:-./data/mysql8}:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:v1.18
    container_name: serverrs-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant/storage:/qdrant/storage
