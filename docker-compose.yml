name: serverrs-qqbot

services:
  qqbot-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${QQBOT_MYSQL_ROOT_PASSWORD:?请在 .env 中设置 QQBOT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: qq_personal_secretary
      MYSQL_USER: serverrs
      MYSQL_PASSWORD: ${QQBOT_MYSQL_PASSWORD:?请在 .env 中设置 QQBOT_MYSQL_PASSWORD}
    ports:
      - "${QQBOT_MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - qqbot-mysql-data:/var/lib/mysql
      - ./qqbot-server/database/baseline/20260806_qqbot_schema_v2.sql:/docker-entrypoint-initdb.d/001-qqbot-baseline.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  qqbot:
    build:
      context: .
      dockerfile: qqbot-server/Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      qqbot-mysql:
        condition: service_healthy
      qqbot-migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QQBOT_CONFIG_PATH: /app/config/qqbot.toml
      QQBOT_DATABASE_URL: mysql://serverrs:${QQBOT_MYSQL_PASSWORD}@qqbot-mysql:3306/qq_personal_secretary
      QQBOT_REALTIME_SPOOL_KEY: ${QQBOT_REALTIME_SPOOL_KEY:?请在 .env 中设置 QQBOT_REALTIME_SPOOL_KEY}
      QQBOT_RECALL_WAL_KEY: ${QQBOT_RECALL_WAL_KEY:?请在 .env 中设置 QQBOT_RECALL_WAL_KEY}
      NAPCAT_SELF_QQ_ID: ${NAPCAT_SELF_QQ_ID:?请在 .env 中设置 NAPCAT_SELF_QQ_ID}
      NAPCAT_HTTP_BASE_URL: http://127.0.0.1:3000
      NAPCAT_WS_URL: ws://127.0.0.1:6700
      NAPCAT_HOST_HTTP_PORT: ${NAPCAT_HOST_HTTP_PORT:-3001}
      NAPCAT_HOST_WS_PORT: ${NAPCAT_HOST_WS_PORT:-6701}
      QQBOT_LLM_ENABLED: ${QQBOT_LLM_ENABLED:-false}
      QQBOT_LLM_PROVIDER: ${QQBOT_LLM_PROVIDER:-deepseek}
      QQBOT_LLM_MODEL: ${QQBOT_LLM_MODEL:-deepseek-v4-flash}
      QQBOT_DEEPSEEK_API_KEY: ${QQBOT_DEEPSEEK_API_KEY:-}
      QQBOT_OPEN_PLATFORM_ENABLED: ${QQBOT_OPEN_PLATFORM_ENABLED:-false}
      QQBOT_OPEN_PLATFORM_APP_ID: ${QQBOT_OPEN_PLATFORM_APP_ID:-}
      QQBOT_OPEN_PLATFORM_CLIENT_SECRET: ${QQBOT_OPEN_PLATFORM_CLIENT_SECRET:-}
      QQBOT_OPEN_PLATFORM_OWNER_OPENID: ${QQBOT_OPEN_PLATFORM_OWNER_OPENID:-}
      QQBOT_OPEN_PLATFORM_LIFECYCLE_NOTIFICATIONS: ${QQBOT_OPEN_PLATFORM_LIFECYCLE_NOTIFICATIONS:-true}
      QQBOT_OPEN_PLATFORM_PROACTIVE_NOTIFICATIONS: ${QQBOT_OPEN_PLATFORM_PROACTIVE_NOTIFICATIONS:-false}
      QQBOT_BACKFILL_ENABLED: ${QQBOT_BACKFILL_ENABLED:-false}
      QQBOT_BACKFILL_EARLIEST_DATE: ${QQBOT_BACKFILL_EARLIEST_DATE:-2026-03-01}
      QQBOT_FOLLOW_UP_ENABLED: ${QQBOT_FOLLOW_UP_ENABLED:-false}
      QQBOT_AGENDA_ENABLED: ${QQBOT_AGENDA_ENABLED:-false}
      QQBOT_NOTIFICATION_POLICY_ENABLED: ${QQBOT_NOTIFICATION_POLICY_ENABLED:-false}
      QQBOT_ADMIN_ENABLED: ${QQBOT_ADMIN_ENABLED:-true}
      QQBOT_ADMIN_BIND: 0.0.0.0
      QQBOT_ADMIN_PORT: 8080
      QQBOT_ADMIN_PASSWORD: ${QQBOT_ADMIN_PASSWORD:?请在 .env 中设置 QQBOT_ADMIN_PASSWORD（至少 12 字节）}
      QQBOT_WHITELIST_FILE: /app/config/data/group-whitelist.json
      RUST_LOG: ${QQBOT_RUST_LOG:-qqbot_server=info,qqbot=info,personal_secretary=info}
    ports:
      - "127.0.0.1:${QQBOT_ADMIN_HOST_PORT:-8080}:8080"
    volumes:
      - qqbot-spool-data:/app/config/data

  qqbot-migrate:
    image: mysql:8.4
    restart: "no"
    depends_on:
      qqbot-mysql:
        condition: service_healthy
    environment:
      QQBOT_MYSQL_USER: serverrs
      QQBOT_MYSQL_PASSWORD: ${QQBOT_MYSQL_PASSWORD:?请在 .env 中设置 QQBOT_MYSQL_PASSWORD}
      QQBOT_MYSQL_DATABASE: qq_personal_secretary
    entrypoint: ["/bin/sh", "/migrate/run-migrations.sh"]
    volumes:
      - ./qqbot-server/database/run-migrations.sh:/migrate/run-migrations.sh:ro
      - ./qqbot-server/database/migrations:/migrations:ro

volumes:
  qqbot-mysql-data:
  qqbot-spool-data:
