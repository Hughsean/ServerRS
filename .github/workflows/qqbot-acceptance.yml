name: QQBot Acceptance Gate

on:
  push:
    paths:
      - "apps/qqbot-server/**"
      - "crates/personal-secretary/**"
      - "crates/qqbot/**"
      - "docs/qq-personal-secretary/acceptance/**"
      - "scripts/verify-qqbot-acceptance.ps1"
      - ".github/workflows/qqbot-acceptance.yml"
  pull_request:
    paths:
      - "apps/qqbot-server/**"
      - "crates/personal-secretary/**"
      - "crates/qqbot/**"
      - "docs/qq-personal-secretary/acceptance/**"
      - "scripts/verify-qqbot-acceptance.ps1"
      - ".github/workflows/qqbot-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: acceptance-only-password
          MYSQL_DATABASE: qqbot_accept_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pacceptance-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run machine-verifiable QQBot acceptance gate
        shell: pwsh
        run: >-
          ./scripts/verify-qqbot-acceptance.ps1
          -DatabaseUrl "mysql://root:acceptance-only-password@127.0.0.1:3306/qqbot_accept_ci"
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqbot-acceptance-evidence
          path: target/qqbot-acceptance/
          if-no-files-found: warn
          retention-days: 14
